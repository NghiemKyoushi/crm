<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stream Cargo CRM - Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f4e9e8 0%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            background: white;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
            padding: 20px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 100px;
            object-fit: contain;
        }

        .spinner {
            margin: 0 auto 20px;
            width: 60px;
            height: 60px;
            position: relative;
        }

        .spinner-circle {
            width: 100%;
            height: 100%;
            border: 4px solid #ED3D25;
            border-top-color: #F1EDEC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: #E74223;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: #161533;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dots {
            display: inline-block;
            width: 20px;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes dots {
            0% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(233, 78, 58, 0.15);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        .particle:nth-child(even) {
            background: rgba(255, 255, 255, 0.08);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="loading-container">
    <div class="logo">
        <img src="icon.png" alt="Stream Cargo Logo">
    </div>

    <div class="spinner">
        <div class="spinner-circle"></div>
    </div>

    <div class="loading-text">
        Đang tải ứng dụng<span class="dots"></span>
    </div>

    <div class="loading-subtext">
        Stream Cargo CRM
    </div>
</div>

<script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.width = (Math.random() * 30 + 10) + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = (Math.random() * 15) + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particlesContainer.appendChild(particle);
    }
</script>
</body>
</html>
